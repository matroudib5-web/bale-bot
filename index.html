<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACK WEB | دارک وب، احتمالا فیک</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- هدر (نوار بالای سایت) -->
    <header>
        <div class="logo-container">
            <!-- فعلا لوگو نداریم، فقط فضای خالی -->
        </div>
    </header>

    <!-- محتوای اصلی (کارت‌ها) -->
    <main class="grid">
        
        <!-- ردیف اول -->
        <div class="card">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1595590424283-b8f17842773f" alt="Assassin"></div>
            <p>Discreet termination services.</p>
            <button class="btn" data-action="assassin">REQUEST CONTRACT</button>
        </div>
        <div class="card">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae" alt="Powder"></div>
            <p>Medical grade synthetic compounds.</p>
            <button class="btn" data-action="drugs">ORDER SUPPLY</button>
        </div>

        <!-- ردیف دوم -->
        <div class="card">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1551028719-00167b16eac5" alt="Human Leather"></div>
            <p>Premium human leather goods.</p>
            <button class="btn" data-action="skin">VIEW COLLECTION</button>
        </div>
        <div class="card">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1517430816045-df4b7de11d1d" alt="Organs"></div>
            <p>Fresh biological components.</p>
            <button class="btn" data-action="organs">SECURE ORGAN</button>
        </div>

        <!-- ردیف سوم -->
        <div class="card">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1544698310-74ea9d188c1b" alt="Passport"></div>
            <p>A new life in the land of the free.</p>
            <button class="btn" data-action="citizenship">BUY CITIZENSHIP</button>
        </div>
        <div class="card">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c" alt="Identity"></div>
            <p>Complete personal dossiers.</p>
            <button class="btn" data-action="identity">ACQUIRE DOSSIER</button>
        </div>

        <!-- ردیف چهارم -->
        <div class="card">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5" alt="Hacking"></div>
            <p>Access to unrecoverable data.</p>
            <button class="btn" data-action="hack">INITIATE BREACH</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
